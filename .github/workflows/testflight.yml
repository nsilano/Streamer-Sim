# TestFlight upload: MANUAL ONLY. Never runs automatically; start it from the Actions tab (Run workflow)
# when you explicitly want a build uploaded. See docs/TESTFLIGHT.md for the one-time setup.
name: TestFlight
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set (see docs/TESTFLIGHT.md)"; exit 1; fi
          done
      - name: Select newest Xcode (App Store requires the iOS 26 SDK / Xcode 26+)
        run: |
          ls -d /Applications/Xcode*.app
          BEST=$(ls -d /Applications/Xcode_*.app | sed -E 's|.*/Xcode_([0-9.]+)(_[A-Za-z0-9_]+)?\.app|\1 &|' | sort -V | tail -1 | cut -d' ' -f2-)
          echo "Using $BEST"
          sudo xcode-select -s "$BEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS "
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey.p8"
          # Accept either the raw .p8 text or its base64 encoding.
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEY"
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY"; then
            echo "::error::ASC_KEY_P8_BASE64 is not a valid App Store Connect .p8 key (expected '-----BEGIN PRIVATE KEY-----'). Re-create the secret from AuthKey_XXXX.p8."
            exit 1
          fi
      - name: Free up signing certificates (revoke old API-created ones)
        # Each run creates cloud-managed certificates; Apple caps how many an account may hold.
        # This revokes only certificates whose name says "Created via API", never ones you made yourself.
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          key = open(os.environ["RUNNER_TEMP"] + "/keys/AuthKey.p8").read()
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
                              "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          h = {"Authorization": "Bearer " + token}
          r = requests.get("https://api.appstoreconnect.apple.com/v1/certificates?limit=200", headers=h)
          print("list certificates:", r.status_code)
          if r.status_code != 200:
              print(r.text[:600]); raise SystemExit(1)
          certs = r.json().get("data", [])
          print("certificates on account:", len(certs))
          revoked = 0
          for c in certs:
              a = c["attributes"]
              label = (a.get("name") or "") + " " + (a.get("displayName") or "")
              print(" -", a.get("certificateType"), "|", label.strip(), "|", a.get("expirationDate"))
              if "Created via API" in label:
                  d = requests.delete("https://api.appstoreconnect.apple.com/v1/certificates/" + c["id"], headers=h)
                  print("   revoke:", d.status_code)
                  if d.status_code in (200, 204): revoked += 1
          print("revoked", revoked, "API-created certificates")
          PY
      - name: Set team id in export options
        run: /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" ExportOptions.plist
      - name: Archive
        run: |
          xcodebuild archive \
            -project StreamEmpire.xcodeproj -scheme StreamEmpire \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StreamEmpire.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StreamEmpire.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Show distribution logs on failure
        if: failure()
        run: |
          for d in $(find /var/folders "$TMPDIR" -name "*.xcdistributionlogs" -maxdepth 6 2>/dev/null | head -3); do
            echo "=== $d"
            for f in "$d"/*.log; do
              echo "--- $f"
              grep -iE "error|fail|status|code|reason|denied|forbidden|agreement|not found|team|bundle|entit|permission|401|403|404" "$f" | cut -c1-600 | head -40
            done
          done
