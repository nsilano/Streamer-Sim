# TestFlight upload: runs on every push to main, or manually from the Actions tab.
# NOT yet exercised: see docs/TESTFLIGHT.md for the one-time setup (App Store Connect app, API key, secrets).
name: TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set (see docs/TESTFLIGHT.md)"; exit 1; fi
          done
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey.p8"
          # Accept either the raw .p8 text or its base64 encoding.
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEY"
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY"; then
            echo "::error::ASC_KEY_P8_BASE64 is not a valid App Store Connect .p8 key (expected '-----BEGIN PRIVATE KEY-----'). Re-create the secret from AuthKey_XXXX.p8."
            exit 1
          fi
      - name: Set team id in export options
        run: /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" ExportOptions.plist
      - name: Archive
        run: |
          xcodebuild archive \
            -project StreamEmpire.xcodeproj -scheme StreamEmpire \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StreamEmpire.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StreamEmpire.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
